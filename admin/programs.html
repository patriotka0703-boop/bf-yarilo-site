<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Программы — админка БФ «ЯРИЛО»</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f4;color:#13231d}header{background:#0e2a21;color:#fff;padding:22px}header .bar{max-width:1040px;margin:auto;display:flex;justify-content:space-between;gap:16px;align-items:center}header a{color:#fff;text-decoration:none}.wrap{max-width:1040px;margin:auto;padding:28px 18px 80px}.status{padding:14px 16px;border-radius:10px;margin-bottom:18px;background:#e9f5ed;position:sticky;top:8px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.08)}.status.error{background:#fde7e7;color:#8d1f1f}.status.ok{background:#dff3e5;color:#164d2d}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}button,.btn{border:0;border-radius:9px;padding:12px 18px;background:#0e2a21;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}.secondary{background:#fff;color:#0e2a21;border:2px solid #0e2a21}.danger{background:#a52a2a}.card{background:#fff;border-radius:16px;padding:22px;margin:0 0 20px;box-shadow:0 4px 18px rgba(0,0,0,.06)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}input,textarea{width:100%;padding:11px 12px;border:1px solid #cbd6d1;border-radius:8px;font:inherit}textarea{min-height:90px;resize:vertical}.preview{max-width:460px;width:100%;max-height:260px;object-fit:contain;border-radius:10px;border:1px solid #e2e7e4;background:#f8faf9;margin:8px 0}.file-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.muted{color:#607069;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.sticky{position:sticky;bottom:0;background:rgba(243,246,244,.97);padding:12px 0;backdrop-filter:blur(6px);z-index:21;border-top:1px solid #dce5e0}.sticky button{font-size:16px;padding:14px 22px}.save-note{display:inline-block;margin-left:12px;color:#52635b;font-size:14px}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.file-row{grid-template-columns:1fr}}
</style></head><body>
<header><div class="bar"><div><b style="font-size:24px">БФ «ЯРИЛО»</b><div>Благотворительные программы</div></div><a href="./">← В основную админку</a></div></header>
<div class="wrap"><div id="status" class="status">Загрузка…</div><div class="toolbar"><button id="add">+ Добавить программу</button><a class="btn secondary" href="../programs.html" target="_blank">Открыть страницу программ</a><button id="reload" class="secondary">Обновить данные</button></div><div id="list"></div><div class="sticky"><button id="save">Сохранить программы на сайте</button><span class="save-note">Фото до 40 МБ (уменьшается автоматически), PDF до 20 МБ.</span></div></div>
<script>
const WORKER='https://yarilo-admin-auth.patriotka0703.workers.dev';
const SITE='https://bf-yarilo.ru';
let token=sessionStorage.getItem('yarilo_session')||localStorage.getItem('yarilo_session')||'';
let programs=[],sha='',uploads=new Map(),previews=new Map(),busy=false,dirty=false;
const $=id=>document.getElementById(id);
function status(t,type=''){const e=$('status');e.textContent=t;e.className='status'+(type?' '+type:'');e.scrollIntoView({block:'nearest',behavior:'smooth'});}function markDirty(){dirty=true;$('save').textContent='Сохранить программы на сайте •';}
async function api(path,opt={}){if(!token){status('Сначала войдите через GitHub в основной админке.','error');throw Error('Нет сеанса GitHub');}let r;try{r=await fetch(WORKER+path,{...opt,cache:'no-store',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}})}catch{throw Error('Не удалось связаться с сервером. Повторите позже.')}let v={};try{v=await r.json()}catch{}if(!r.ok)throw Error(v.message||('Ошибка '+r.status));return v}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function blank(){return {title:'',description:'',details:'',page:'',pdf:'',protocol:'',donate:'/donate.html',image:''}}
function rel(v){if(!v)return'';return v.startsWith('http')?v:'/'+v.replace(/^\//,'')}
function render(){const box=$('list');box.innerHTML='';programs.forEach((p,i)=>{const c=document.createElement('section');c.className='card';c.innerHTML=`<h2>Программа ${i+1}</h2><div class="grid">
<div class="full"><label>Название</label><input data-k="title" value="${esc(p.title)}"></div>
<div class="full"><label>Краткое описание</label><textarea data-k="description">${esc(p.description)}</textarea></div>
<div class="full"><label>Дополнительная информация</label><textarea data-k="details">${esc(p.details)}</textarea></div>
<div><label>Страница «Подробнее»</label><input data-k="page" value="${esc(p.page)}" placeholder="/programma.html"></div><div><label>Ссылка «Поддержать»</label><input data-k="donate" value="${esc(p.donate)}" placeholder="/donate.html"></div>
<div class="full"><label>Обложка программы</label>${p.image?`<img class="preview" src="${esc(previews.get(p.image)||rel(p.image))}">`:''}<div class="file-row"><input type="file" data-file="image" accept=".jpg,.jpeg,.png,.webp"><button type="button" class="secondary" data-clear="image">Убрать фото</button></div><div class="muted">Можно выбрать JPG, PNG или WEBP прямо с компьютера/телефона.</div></div>
<div><label>PDF программы</label><input data-file="pdf" type="file" accept=".pdf"><div class="muted">${p.pdf?`Сейчас: <a href="${esc(rel(p.pdf))}" target="_blank">открыть PDF</a>`:'Не загружен'}</div></div>
<div><label>PDF протокола</label><input data-file="protocol" type="file" accept=".pdf"><div class="muted">${p.protocol?`Сейчас: <a href="${esc(rel(p.protocol))}" target="_blank">открыть PDF</a>`:'Не загружен'}</div></div>
</div><div class="actions"><button type="button" class="secondary" data-up>↑ Выше</button><button type="button" class="secondary" data-down>↓ Ниже</button><button type="button" class="danger" data-del>Удалить программу</button></div>`;
 c.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{p[el.dataset.k]=el.value;markDirty()});
 c.querySelectorAll('[data-file]').forEach(el=>el.onchange=()=>uploadFile(el,p,el.dataset.file,i));
 c.querySelectorAll('[data-clear]').forEach(el=>el.onclick=()=>{p[el.dataset.clear]='';markDirty();render()});
 c.querySelector('[data-up]').onclick=()=>{if(i){[programs[i-1],programs[i]]=[programs[i],programs[i-1]];markDirty();render()}};
 c.querySelector('[data-down]').onclick=()=>{if(i<programs.length-1){[programs[i+1],programs[i]]=[programs[i],programs[i+1]];markDirty();render()}};
 c.querySelector('[data-del]').onclick=()=>{if(confirm('Удалить эту программу с сайта?')){programs.splice(i,1);markDirty();render()}};box.append(c);});}
async function b64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(Error('Не удалось прочитать файл'));r.readAsDataURL(file)})}
async function shrink(file){if(!/\.(jpe?g|png|webp)$/i.test(file.name))return file;const bm=await createImageBitmap(file);try{if(file.size<=2*1024*1024&&Math.max(bm.width,bm.height)<=2560)return file;const s=Math.min(1,2560/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bm.width*s));cv.height=Math.max(1,Math.round(bm.height*s));cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);const blob=await new Promise(r=>cv.toBlob(r,'image/webp',.86));if(!blob)throw Error('Не удалось уменьшить фото');return new File([blob],file.name.replace(/\.[^.]+$/,'.webp'),{type:'image/webp'})}finally{bm.close()}}
async function uploadFile(input,p,key,index){const original=input.files?.[0];if(!original||busy)return;try{busy=true;status('Загружаю файл…');if(key==='image'&&!/\.(jpe?g|png|webp)$/i.test(original.name))throw Error('Для обложки выберите JPG, PNG или WEBP.');if((key==='pdf'||key==='protocol')&&!/\.pdf$/i.test(original.name))throw Error('Выберите PDF.');if(key==='image'&&original.size>40*1024*1024)throw Error('Фото больше 40 МБ. Выберите файл поменьше.');if((key==='pdf'||key==='protocol')&&original.size>20*1024*1024)throw Error('PDF больше 20 МБ. Уменьшите файл.');const file=key==='image'?await shrink(original):original;if(key==='image'&&file.size>8*1024*1024)throw Error('Не удалось автоматически уменьшить фото до допустимого размера.');const r=await api('/upload',{method:'POST',body:JSON.stringify({name:file.name,content:await b64(file)})});p[key]='/'+r.path;uploads.set(r.path,r.receipt);if(key==='image')previews.set(p[key],URL.createObjectURL(file));markDirty();status('Файл загружен на сервер. Теперь нажмите «Сохранить программы на сайте».','ok');render()}catch(e){status(e.message,'error')}finally{busy=false}}
async function load(){try{busy=true;const h=await api('/health');if(!h.features?.programs)throw Error('Сначала обновите Cloudflare Worker файлом из нового комплекта.');const r=await api('/programs');programs=r.programs;sha=r.sha;uploads.clear();dirty=false;$('save').textContent='Сохранить программы на сайте';status('Программы загружены.');render()}catch(e){status(e.message,'error')}finally{busy=false}}
async function save(){if(busy)return;try{busy=true;$('save').disabled=true;status('Сохраняю программы и файлы…');for(const [i,p] of programs.entries())if(!p.title.trim())throw Error('У программы № '+(i+1)+' не заполнено название.');const r=await api('/programs',{method:'POST',body:JSON.stringify({programs,sha,uploads:[...uploads.values()]})});sha=r.sha;uploads.clear();dirty=false;$('save').textContent='Сохранить программы на сайте';status('ГОТОВО: программы сохранены в GitHub. Подождите 1–2 минуты и обновите страницу программ.','ok');}catch(e){status('НЕ СОХРАНЕНО: '+e.message,'error')}finally{busy=false;$('save').disabled=false}}
$('add').onclick=()=>{programs.push(blank());markDirty();render();setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),50)};$('save').onclick=save;$('reload').onclick=()=>{if(confirm('Отменить несохранённые изменения и загрузить данные заново?'))load()};window.addEventListener('beforeunload',e=>{if(dirty||uploads.size){e.preventDefault();e.returnValue='';}});load();
</script></body></html>
